# Render Blueprint: one web service (API + built React app) and one Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then set GOOGLE_CLIENT_ID (see README).
databases:
  - name: ese-db
    databaseName: ese
    plan: free        # free Postgres is time-limited on Render; upgrade the plan to keep data long-term

services:
  - type: web
    name: ese-ece-tracker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ese-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false     # you paste this in the Render dashboard
